[package]
name = "signalsmith-stretch"
version = "0.1.3"
edition = "2021"
authors = ["Colin Marc <hi@colinmarc.com>"]
description = "Vendored copy of signalsmith-stretch 0.1.3 (MIT): build.rs uses only `cc`, FFI declarations are hand-written (no bindgen/libclang)"
license = "MIT"
repository = "https://github.com/colinmarc/signalsmith-stretch-rs"
publish = false

[lib]
name = "signalsmith_stretch"
path = "src/lib.rs"

[build-dependencies]
cc = "1"
